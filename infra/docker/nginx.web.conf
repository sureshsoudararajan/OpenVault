server {
    listen 3000;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File upload limits
        client_max_body_size 5g;
        proxy_request_buffering off;
    }

    # MinIO storage proxy — allows browser to reach MinIO via /storage/
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for large file uploads
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebDAV proxy
    location /dav {
        # Redirect /dav to /dav/ to help some clients
        # but proxy_pass will handle it if we are careful
        proxy_pass http://api:4000/dav;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebDAV specific settings
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        
        # Pass all methods for WebDAV (PROPFIND, OPTIONS, MKCOL, COPY, MOVE, etc)
        proxy_method $request_method;
        proxy_set_header Destination $http_destination;
        
        # Ensure Basic Auth headers are passed
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}
